[project]
name = "starter-taskiq"
version = "0.1.0"
description = "Kanboto TaskIQ starter: a production-ready background worker"
requires-python = ">=3.13"
dependencies = [
    "taskiq>=0.13,<1",
    "taskiq-nats>=0.7,<1",
    "nats-py>=2.16,<3",
    "uvicorn>=0.54,<1",
    "pydantic-settings>=2.15,<3",
    "prometheus-client>=0.26,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=2.4,<3",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.16,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
