name: Compositions
# The Python base composed with several modules, as Kanboto scaffolds a repository: every module together, a
# module copied under another package name, and one module twice. One module alone is checked by its CI kit
# (kanboto-ci-python-*).
'on':
  pull_request: null
  push:
    branches:
    - master
permissions:
  contents: read
  packages: read
concurrency:
  group: compositions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compose:
    name: composition-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: fastapi-taskiq
          modules: fastapi taskiq
          extras: --extra api --extra worker
        - name: fastapi-tasks
          modules: fastapi tasks
          extras: --extra api --extra tasks
        - name: fastapi-renamed
          modules: fastapi:hooks
          extras: --extra api
        - name: fastapi-twice
          modules: fastapi fastapi:hooks
          extras: --extra api
    services:
      postgres:
        image: ghcr.io/kanboto/postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
        - 5432:5432
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Composition
      run: python3 scripts/compose.py "$RUNNER_TEMP/composed" ${{ matrix.modules }}
    - name: Installer uv
      run: pipx install uv
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - name: Dépendances
      working-directory: ${{ runner.temp }}/composed
      run: uv sync --locked ${{ matrix.extras }}
    - name: Lint · uv run ruff check .
      working-directory: ${{ runner.temp }}/composed
      run: uv run ruff check .
    - name: Lint · uv run ruff format --check .
      working-directory: ${{ runner.temp }}/composed
      run: uv run ruff format --check .
    - name: Lint · uv run mypy .
      working-directory: ${{ runner.temp }}/composed
      run: uv run mypy .
    - name: Tests · uv run pytest
      working-directory: ${{ runner.temp }}/composed
      run: uv run pytest
    - name: Image · build
      working-directory: ${{ runner.temp }}/composed
      run: docker build --pull -t composed-image .
