name: Image scan
# Every vulnerability with a fix in the starters' built images, Trivy from the mirror as in the CI kits. Daily,
# after mirror-images refreshes the vulnerability database: a red run means a fix exists, to bring into the
# starter before a new project inherits it (refresh the base digest with Dependabot's "Check for updates",
# or fix the Dockerfile). The CI kits only block what a pull request introduces.
'on':
  schedule:
  - cron: '0 10 * * *'
  workflow_dispatch: null
permissions:
  contents: read
  packages: read
concurrency:
  group: image-scan
  cancel-in-progress: true
jobs:
  scan:
    name: image-scan-${{ matrix.starter }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        starter: [fastapi, nuxt, taskiq]
    defaults:
      run:
        working-directory: ${{ matrix.starter }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Build
      run: docker build --pull -t starter-image .
    - name: Trivy
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/trivy"
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP/trivy:/cache" \
          ghcr.io/kanboto/trivy:stable image --cache-dir /cache --skip-version-check \
          --db-repository ghcr.io/kanboto/trivy-db:2 \
          --scanners vuln --ignore-unfixed --exit-code 1 starter-image
