# Kit CI Kanboto python v8 : ne pas modifier, Kanboto le met à jour par PR.
name: Kanboto CI · Python (tasks)
'on':
  pull_request: null
  push:
    branches:
    - master
    - hotfix/**
permissions:
  contents: read
  packages: read
concurrency:
  group: kanboto-ci-python-tasks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: kanboto-ci-python-tasks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ../composed
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Composition · socle python et module tasks
      working-directory: .
      run: python3 scripts/compose.py ../composed tasks
    - name: Installer uv
      run: pipx install uv
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - name: Dépendances
      run: uv sync --locked --all-extras
    - name: Lint · uv run ruff check . --extend-select C901,PLR0911,PLR0912,PLR0913,PLR0915
      run: uv run ruff check . --extend-select C901,PLR0911,PLR0912,PLR0913,PLR0915
    - name: Lint · uv run ruff format --check .
      run: uv run ruff format --check .
    - name: Lint · uv run mypy .
      run: uv run mypy .
    - name: Duplication · jscpd
      run: npx --yes jscpd@5.4.1 . --ignore "**/openapi/*.yaml,**/package-lock.json,**/pnpm-lock.yaml,**/yarn.lock,**/bun.lock,**/poetry.lock,**/uv.lock,**/pdm.lock,**/Pipfile.lock,**/.terraform.lock.hcl"
    - name: Scan · trivy fs, failles introduites
      env:
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        set -euo pipefail
        docker run --rm -v "$GITHUB_WORKSPACE":/src:ro -w /src -v "$RUNNER_TEMP:/out" -v "$RUNNER_TEMP/trivy:/cache" \
          ghcr.io/kanboto/trivy:stable fs --cache-dir /cache --skip-version-check \
          --db-repository ghcr.io/kanboto/trivy-db:2 \
          --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --format json --output /out/scan-head.json python
        rm -f "$RUNNER_TEMP/scan-base.json"
        if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
          git worktree add --detach "$RUNNER_TEMP/kanboto-base" "$BASE" >/dev/null
          if [ -e "$RUNNER_TEMP/kanboto-base/python" ]; then
          docker run --rm -v "$RUNNER_TEMP/kanboto-base":/src:ro -w /src -v "$RUNNER_TEMP:/out" -v "$RUNNER_TEMP/trivy:/cache" \
            ghcr.io/kanboto/trivy:stable fs --cache-dir /cache --skip-version-check \
            --db-repository ghcr.io/kanboto/trivy-db:2 \
            --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --format json --output /out/scan-base.json python
          else
            echo '{}' > "$RUNNER_TEMP/scan-base.json"  # python absent de la base : rien n'y était
          fi
          git worktree remove --force "$RUNNER_TEMP/kanboto-base"
        else
          echo "Base de comparaison introuvable ($BASE) : scan informatif"
        fi
        python3 - "Scan" "$RUNNER_TEMP/scan-head.json" "$RUNNER_TEMP/scan-base.json" <<'PY'
        import json, sys
        def load(path):
            try:
                data = json.load(open(path))
            except (OSError, ValueError):
                return None
            found = {}
            for result in data.get("Results") or []:
                where = result.get("Target", "")
                target = "" if result.get("Class") == "os-pkgs" else where
                for v in result.get("Vulnerabilities") or []:
                    line = (f"{v.get('VulnerabilityID')} {v.get('Severity', '')} {v.get('PkgName', '')} "
                            f"{v.get('InstalledVersion', '')} -> {v.get('FixedVersion', '')} ({where})")
                    found[(target, v.get("PkgName", ""), v.get("VulnerabilityID", ""))] = line
                for m in result.get("Misconfigurations") or []:
                    if m.get("Status") == "FAIL":
                        line = f"{m.get('ID')} {m.get('Severity', '')} {m.get('Title', '')} ({where})"
                        found[(target, "", m.get("ID", ""))] = line
            return found
        title, head_path, base_path = sys.argv[1:4]
        head = load(head_path) or {}
        base = load(base_path)
        if base is None:
            for line in head.values():
                print(f"::warning title={title}::{line}")
            print(f"{len(head)} faille(s), sans base de comparaison : non bloquant")
            sys.exit(0)
        new = [line for key, line in head.items() if key not in base]
        for line in new:
            print(f"::error title={title}::introduite par ce changement : {line}")
        known = len(head) - len(new)
        if known:
            print(f"{known} faille(s) déjà présente(s) sur la base : suivies par les alertes, non bloquantes")
        sys.exit(1 if new else 0)
        PY
      working-directory: .
    - name: Tests · uv run pytest
      run: uv run pytest
    - name: Image · hadolint
      run: docker run --rm -i ghcr.io/kanboto/hadolint:stable hadolint - < Dockerfile
    - name: Image · build
      run: docker build --pull -t kanboto-ci-image .
    - name: Image · trivy, failles introduites
      env:
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ACTOR: ${{ github.actor }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        IMAGE="ghcr.io/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')-tasks"
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP:/out" -v "$RUNNER_TEMP/trivy:/cache" \
          ghcr.io/kanboto/trivy:stable image --cache-dir /cache --skip-version-check \
          --db-repository ghcr.io/kanboto/trivy-db:2 \
          --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --format json --output /out/image-head.json kanboto-ci-image
        rm -f "$RUNNER_TEMP/image-base.json"
        if [ -n "$BASE" ] && echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin >/dev/null 2>&1 \
          && docker pull -q "$IMAGE:$BASE" >/dev/null 2>&1; then
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP:/out" -v "$RUNNER_TEMP/trivy:/cache" \
          ghcr.io/kanboto/trivy:stable image --cache-dir /cache --skip-version-check \
          --db-repository ghcr.io/kanboto/trivy-db:2 \
          --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --format json --output /out/image-base.json "$IMAGE:$BASE"
        else
          echo "Image de la base absente ($IMAGE:$BASE) : scan informatif"
        fi
        docker logout ghcr.io >/dev/null 2>&1 || true
        python3 - "Scan de l'image" "$RUNNER_TEMP/image-head.json" "$RUNNER_TEMP/image-base.json" <<'PY'
        import json, sys
        def load(path):
            try:
                data = json.load(open(path))
            except (OSError, ValueError):
                return None
            found = {}
            for result in data.get("Results") or []:
                where = result.get("Target", "")
                target = "" if result.get("Class") == "os-pkgs" else where
                for v in result.get("Vulnerabilities") or []:
                    line = (f"{v.get('VulnerabilityID')} {v.get('Severity', '')} {v.get('PkgName', '')} "
                            f"{v.get('InstalledVersion', '')} -> {v.get('FixedVersion', '')} ({where})")
                    found[(target, v.get("PkgName", ""), v.get("VulnerabilityID", ""))] = line
                for m in result.get("Misconfigurations") or []:
                    if m.get("Status") == "FAIL":
                        line = f"{m.get('ID')} {m.get('Severity', '')} {m.get('Title', '')} ({where})"
                        found[(target, "", m.get("ID", ""))] = line
            return found
        title, head_path, base_path = sys.argv[1:4]
        head = load(head_path) or {}
        base = load(base_path)
        if base is None:
            for line in head.values():
                print(f"::warning title={title}::{line}")
            print(f"{len(head)} faille(s), sans base de comparaison : non bloquant")
            sys.exit(0)
        new = [line for key, line in head.items() if key not in base]
        for line in new:
            print(f"::error title={title}::introduite par ce changement : {line}")
        known = len(head) - len(new)
        if known:
            print(f"{known} faille(s) déjà présente(s) sur la base : suivies par les alertes, non bloquantes")
        sys.exit(1 if new else 0)
        PY
    - name: Image · contrat d'exécution
      run: |
        set -euo pipefail
        fail() { echo "::error title=Contrat d'exécution::$1"; docker logs app 2>&1 | tail -40 || true; exit 1; }
        if [ ! -f .env.example ]; then fail ".env.example absent : chaque variable lue doit y figurer"; fi
        user=$(docker image inspect --format '{{.Config.User}}' kanboto-ci-image)
        case "$user" in ""|root|0|0:*) fail "l'image tourne en root : déclarer un USER non-root";; esac
        docker run -d --name app --read-only --tmpfs /tmp --env-file .env.example kanboto-ci-image >/dev/null
        status=$(timeout 60 docker wait app || echo timeout)
        if [ "$status" = timeout ]; then fail "la commande par défaut ne s'arrête pas en 60 s"; fi
        if [ "$status" != 0 ]; then
          fail "la commande par défaut sort en $status (lecture seule, variables de .env.example)"
        fi
        docker logs app 2>&1 | python3 -c 'import json, sys
        bad = []
        for line in sys.stdin.read().splitlines():
            if line.strip():
                try:
                    json.loads(line)
                except ValueError:
                    bad.append(line)
        if bad:
            print(f"{len(bad)} ligne(s) de log hors JSON, dont : {bad[0][:200]}")
        sys.exit(1 if bad else 0)
        ' || fail "logs hors JSON sur la sortie standard"
        echo "Contrat d'exécution respecté : les tâches se chargent en lecture seule"
