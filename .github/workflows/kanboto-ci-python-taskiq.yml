# Kit CI Kanboto python v4 : ne pas modifier, Kanboto le met à jour par PR.
name: Kanboto CI · Python (taskiq)
'on':
  pull_request: null
  push:
    branches:
    - master
permissions:
  contents: read
concurrency:
  group: kanboto-ci-python-taskiq-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: kanboto-ci-python-taskiq
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: taskiq
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Installer uv
      run: pipx install uv
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - name: Dépendances
      run: uv sync --locked
    - name: Lint · uv run ruff check .
      run: uv run ruff check .
    - name: Lint · uv run ruff format --check .
      run: uv run ruff format --check .
    - name: Lint · uv run mypy .
      run: uv run mypy .
    - name: Scan · trivy fs
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: fs
        scan-ref: taskiq
        scanners: vuln
        ignore-unfixed: true
        severity: HIGH,CRITICAL
        exit-code: '1'
    - name: Tests · uv run pytest
      run: uv run pytest
    - name: Image · hadolint
      run: docker run --rm -i hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d hadolint
        - < Dockerfile
    - name: Image · build
      run: docker build --pull -t kanboto-ci-image .
    - name: Image · trivy
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: image
        image-ref: kanboto-ci-image
        scanners: vuln
        ignore-unfixed: true
        severity: HIGH,CRITICAL
        exit-code: '1'
    - name: Image · contrat d'exécution
      run: |
        set -euo pipefail
        fail() { echo "::error title=Contrat d'exécution::$1"; docker logs app 2>&1 | tail -40 || true; exit 1; }
        if [ ! -f .env.example ]; then fail ".env.example absent : chaque variable lue doit y figurer"; fi
        user=$(docker image inspect --format '{{.Config.User}}' kanboto-ci-image)
        case "$user" in ""|root|0|0:*) fail "l'image tourne en root : déclarer un USER non-root";; esac
        docker run -d --name app --read-only --tmpfs /tmp --env-file .env.example -e PORT=8080 -p 8080:8080 \
          kanboto-ci-image >/dev/null
        code=000
        for _ in $(seq 1 30); do
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/healthz || true)
          if [ "$code" = 200 ]; then break; fi
          if [ "$(docker inspect -f '{{.State.Running}}' app)" != true ]; then
            fail "le conteneur s'arrête au démarrage (lecture seule, variables de .env.example)"
          fi
          sleep 1
        done
        if [ "$code" != 200 ]; then fail "/healthz ne répond pas 200 ($code)"; fi
        code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/readyz || true)
        case "$code" in 200|503) ;; *) fail "/readyz doit répondre 200 ou 503 ($code)";; esac
        curl -sf localhost:8080/metrics | grep -q '^# TYPE ' || fail "/metrics ne rend pas le format Prometheus"
        start=$(date +%s)
        docker stop -t 30 app >/dev/null
        elapsed=$(( $(date +%s) - start ))
        status=$(docker inspect -f '{{.State.ExitCode}}' app)
        if [ "$elapsed" -ge 30 ]; then fail "SIGTERM ignoré : le conteneur a été tué au bout de 30 s"; fi
        case "$status" in 0|143) ;; *) fail "code de sortie $status après SIGTERM";; esac
        docker logs app 2>&1 | python3 -c 'import json, sys
        bad = []
        for line in sys.stdin.read().splitlines():
            if line.strip():
                try:
                    json.loads(line)
                except ValueError:
                    bad.append(line)
        if bad:
            print(f"{len(bad)} ligne(s) de log hors JSON, dont : {bad[0][:200]}")
        sys.exit(1 if bad else 0)
        ' || fail "logs hors JSON sur la sortie standard"
        echo "Contrat d'exécution respecté : arrêt propre en $elapsed s"
