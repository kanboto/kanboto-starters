name: Dependabot auto-merge
# Dependabot's configuration is Kanboto's kit: majors are ignored, so every pull request it opens (security
# fix, Monday's minors and patches, base image digest) is merged once the CI kits required on master pass.
# Auto-merge is enabled with the token of a GitHub App installed on this repository only: a merge made with
# the GITHUB_TOKEN triggers no workflow, so the CI kits would never run on master and `tag.yml` would never
# move `v1`. Workflows triggered by Dependabot only read Dependabot secrets: AUTOMERGE_APP_ID and
# AUTOMERGE_APP_PRIVATE_KEY are stored there.
'on': pull_request
permissions:
  contents: read
jobs:
  automerge:
    name: dependabot-automerge
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: App token
      id: app
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
      with:
        app-id: ${{ secrets.AUTOMERGE_APP_ID }}
        private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
    - name: Enable auto-merge
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}
        PR_URL: ${{ github.event.pull_request.html_url }}
      run: gh pr merge --auto --squash "$PR_URL"
