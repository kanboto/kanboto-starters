package = "api"
extra = "api"
files = ["openapi/{package}.yaml"]

[env]
PORT = "8080"
DRAIN_DELAY_S = "5"
SHUTDOWN_TIMEOUT_S = "20"
HTTP_CONNECT_TIMEOUT_S = "3"
HTTP_TIMEOUT_S = "10"
HTTP_MAX_CONNECTIONS = "100"
CORS_ORIGINS = ""
FORWARDED_ALLOW_IPS = "127.0.0.1"
MAX_BODY_BYTES = "1048576"
MAX_UPLOAD_BYTES = "10485760"
IDEMPOTENCY_TTL_S = "86400"

[dockerfile]
copy = ["{package}"]
cmd = ["{package}", "serve"]

[rename]
files = ["tests/{package}/**/*.py"]
