[project]
name = "starter-fastapi"
version = "0.1.0"
description = "Kanboto FastAPI starter: a production-ready API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143,<1",
    "uvicorn>=0.54,<1",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy[asyncio]>=2.1,<3",
    "asyncpg>=0.32,<1",
    "alembic>=1.20,<2",
    "prometheus-client>=0.26,<1",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22,<1",
    "mypy>=2.4,<3",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pyyaml>=6,<7",
    "ruff>=0.16,<1",
    "types-pyyaml>=6,<7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
